name: Lamplight
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    # Replaced with the real Apple Team ID when building for TestFlight.
    DEVELOPMENT_TEAM: LAMPDEV000
    LAMPLIGHT_BUNDLE_ID: com.$(DEVELOPMENT_TEAM).lamplight
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Manual
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  Lamplight:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes: ["Resources/*.js"]
      - path: App/Resources/Readability.js
        buildPhase: resources
      - path: App/Resources/LamplightExtract.js
        buildPhase: resources
      - path: Shared
      - path: content/nights.json
        buildPhase: resources
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Lamplight
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.books
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIBackgroundModes:
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - $(PRODUCT_BUNDLE_IDENTIFIER).refresh
        CFBundleURLTypes:
          - CFBundleURLName: $(PRODUCT_BUNDLE_IDENTIFIER)
            CFBundleURLSchemes:
              - lamplight
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(LAMPLIGHT_BUNDLE_ID)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
    dependencies:
      - target: LamplightWidget
        embed: true
        codeSign: true

  LamplightWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
      - path: Shared
      - path: content/nights.json
        buildPhase: resources
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Lamplight
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(LAMPLIGHT_BUNDLE_ID).Widget
        APPLICATION_EXTENSION_API_ONLY: YES

schemes:
  Lamplight:
    build:
      targets:
        Lamplight: all
    run:
      config: Debug
    archive:
      config: Release
